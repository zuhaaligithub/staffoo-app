apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def enableHermes = true   // ← usually true in modern RN apps

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.staffoo.newapp"

    defaultConfig {
        applicationId "com.staffoo.newapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 14     
        versionName "1.2.3"  
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

    release {
            storeFile file('my-release-key.keystore')
            storePassword project.properties['MYAPP_RELEASE_STORE_PASSWORD']
            keyAlias project.properties['MYAPP_RELEASE_KEY_ALIAS']
            keyPassword project.properties['MYAPP_RELEASE_KEY_PASSWORD']
        }  
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release          // ← FIXED – now uses release key
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation 'com.onesignal:OneSignal:[5.0.0, 5.99.99]'
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
    implementation 'androidx.browser:browser:1.8.0'

    // Firebase (using BOM – good practice)
    implementation platform('com.google.firebase:firebase-bom:33.1.0')   // ← updated to newer stable
    implementation 'com.google.firebase:firebase-analytics'

    // React Native core
    implementation("com.facebook.react:react-android")

    if (enableHermes) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"